[workspace]
resolver = "2"
members = ["stuff-core", "stuff-cli", "stuff-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
clap = { version = "4.6", features = ["derive", "env"] }
eframe = "0.36"
egui = "0.36"
pretty_assertions = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "migrate", "macros"] }
