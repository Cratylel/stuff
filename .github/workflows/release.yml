name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.platform }} (${{ matrix.target }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: stuff-app/ui/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        working-directory: stuff-app/ui
        run: npm ci

      - name: Build CLI
        run: cargo build --release --package stuff-cli --target ${{ matrix.target }}

      - name: Prepare CLI release asset (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release-assets
          cp target/${{ matrix.target }}/release/stuff \
            release-assets/stuff-cli-${{ matrix.target }}

      - name: Prepare CLI release asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item `
            "target/${{ matrix.target }}/release/stuff.exe" `
            "release-assets/stuff-cli-${{ matrix.target }}.exe"

      - name: Build and publish desktop bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: stuff-app
          tagName: ${{ github.ref_name }}
          releaseName: Stuff ${{ github.ref_name }}
          releaseBody: See the assets below to download Stuff for your platform.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload CLI release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/*
